<div id="app">
  <!-- Shown from first paint (before the bundle runs) until the panel is ready
       and the session list has loaded, so there is one loading state instead of
       blank -> shell -> late spinner. -->
  <div id="boot">
    <div class="boot-inner">
      <div class="boot-spinner"></div>
      <div class="boot-label">Loading Devin&hellip;</div>
    </div>
  </div>

  <div id="setup" class="hidden"></div>

  <div id="chat" class="hidden">
    <!-- Full-height sessions sidebar on the LEFT; the chat content shrinks to
         its right when it is open. A drag handle between them resizes it. -->
    <div id="sessions-panel" class="hidden"></div>
    <div id="sessions-resizer" class="hidden" title="Drag to resize"></div>
    <div id="chat-main">
    <div id="chat-header">
      <!-- Thread-mode left cluster. panel-toggle either toggles the docked
           sessions panel (wide) or opens the session switcher (narrow). -->
      <button id="panel-toggle" class="icon-btn hidden"></button>
      <span id="header-divider" class="header-divider hidden"></span>
      <button id="history-btn" class="icon-btn hidden" title="Back to sessions"><i class="codicon codicon-arrow-left"></i></button>
      <!-- Refresh sits in front of the "Sessions" title on the list page. -->
      <button id="list-refresh-btn" class="icon-btn hidden" title="Refresh sessions"><i class="codicon codicon-refresh"></i></button>
      <button id="title-btn" class="title-btn"><span id="title-code" class="session-code hidden"></span><span id="chat-title">Chat</span></button>
      <span class="spacer"></span>
      <span id="status"></span>
      <!-- List-mode right cluster -->
      <div id="new-session-dd" class="hidden"></div>
      <button id="list-search-btn" class="icon-btn hidden" title="Search sessions"><i class="codicon codicon-search"></i></button>
      <button id="list-filter-btn" class="icon-btn hidden" title="Filter sessions"><i class="codicon codicon-filter"></i></button>
      <button id="settings-btn" class="icon-btn hidden" title="Devin settings"><i class="codicon codicon-gear"></i></button>
      <!-- Thread-mode right cluster -->
      <button id="terminate-btn" class="icon-btn hidden" title="Terminate this session (stop its process)"></button>
    </div>

    <div id="body">
      <div id="sessions-list" class="hidden"></div>
      <div id="thread"></div>
      <!-- Jump-to-bottom button (VS Code's .chat-scroll-down): a round secondary
           button bottom-right of the thread, shown only when scrolled up. -->
      <button id="scroll-down" class="chat-scroll-down" title="Scroll to bottom"><i class="codicon codicon-chevron-down"></i></button>
    </div>

    <div id="composer">
      <div id="elicitation-tray"></div>
      <div id="permission-tray"></div>
      <div id="todo-widget" class="hidden"></div>
      <div id="working-set" class="hidden"></div>
      <div id="autocomplete" class="hidden"></div>
      <div id="input-box">
        <div id="attachments" class="hidden"></div>
        <textarea id="input" rows="1" placeholder="Ask Devin"></textarea>
        <div id="toolbar">
          <div class="toolbar-left">
            <button id="attach" class="tool-ctl" title="Add context: files, selection, images (or type @)"><i class="codicon codicon-add"></i></button>
            <div id="mode-dd" class="dd"></div>
            <div id="model-dd" class="dd"></div>
            <div id="thinking-dd" class="dd hidden"></div>
          </div>
          <div class="toolbar-right">
            <button id="usage" class="usage-ring hidden" title=""></button>
            <button id="send" class="send-btn" title="Send (Enter)" disabled><i class="codicon codicon-newline"></i></button>
            <button id="stop" class="send-btn stop hidden" title="Stop"><i class="codicon codicon-stop-circle"></i></button>
          </div>
        </div>
      </div>
    </div>
    </div>
  </div>
</div>
