name: Release

# Publishes the extension to the VS Code Marketplace and Open VSX whenever a
# GitHub Release is published. The release tag must match the version in
# package.json (e.g. tag v0.6.60 -> "version": "0.6.60").

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Test
        run: npm test

      - name: Verify version matches release tag
        id: version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG" != "${TAG#v}" ]; then
            echo "::error::package.json version ($PKG) does not match release tag ($TAG). Bump the version in package.json to match the tag."
            exit 1
          fi
          echo "vsix=devin-vscode-${PKG}.vsix" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: npm run package

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --packagePath "${{ steps.version.outputs.vsix }}"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish "${{ steps.version.outputs.vsix }}" --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Attach VSIX to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.vsix }}
